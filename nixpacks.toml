# nixpacks.toml (place at repo root, same folder as bot.py / railway.json)

[phases.setup]
# Ensure Node/NPM exists for frontend build + typical Python build tooling
nixPkgs = ["python311", "gcc", "nodejs"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm ci && npm run build && cd .."
]

[start]
cmd = "python bot.py"
