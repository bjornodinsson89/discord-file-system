[tool.ruff]
target-version = "py311"
line-length = 100
include = ["config.py", "utils/**/*.py"]

[tool.ruff.lint]
# Conservative linting focused on clear correctness issues.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_configs = true
files = ["config.py", "utils"]
ignore_missing_imports = true
follow_imports = "skip"
