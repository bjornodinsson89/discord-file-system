[tool.ruff]
target-version = "py311"
line-length = 100
include = ["config.py", "utils/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "UP006", "UP017", "UP035", "UP037", "UP041", "UP045", "B904"]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_configs = true
files = ["config.py", "utils"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
